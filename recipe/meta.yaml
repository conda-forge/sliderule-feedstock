{% set name = "sliderule" %}
{% set version = "5.8.2" %}
{% set sha256 = "e3de6199725f40a09d7a4962bf49e08dba4ce1a69bb4a8623faceee65e1a9a17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77.0.0
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - requests
    - numpy
    - geopandas
    - shapely
    - pyarrow

test:
  imports:
    - sliderule
  commands:
    - pip check
    - python -c "import sliderule; assert sliderule.__version__ == '{{ version }}', sliderule.__version__"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://slideruleearth.io/
  summary: Python client for SlideRule
  license: BSD-3-Clause
  license_file: LICENSE
  description: |
    Python client to interact with SlideRule, a public web service for processing Earth science data
  doc_url: http://slideruleearth.io/rtd/
  dev_url: https://github.com/SlideRuleEarth/sliderule

extra:
  recipe-maintainers:
    - dshean
    - jpswinski
    - scottyhq
    - tsutterley
